title: 휴대폰 성지·공동구매 자주 묻는 질문과 용어집
updated: "2026-11-11"
intro: 휴대폰 성지 카페를 처음 이용할 때 가장 많이 묻는 질문과, 시세표에 나오는 용어를 정리했습니다. 올댓폰 카페 운영 측이 작성했습니다.
faq:
  - q: 휴대폰 성지가 뭔가요?
    a: 통신사 공시지원금 외에 판매점이 자체 지원금을 더 얹어 일반 매장보다 싸게 파는 휴대폰 판매점을 흔히 '성지'라고 부릅니다. 가격이 싼 대신 요금제 유지 기간이나 부가서비스 가입 같은 조건이 붙는 경우가 많아, 가격과 조건을 함께 봐야 합니다.
  - q: 휴대폰 성지 카페는 어떤 곳인가요?
    a: 여러 성지 매장이 그날의 시세표를 올리고, 구매자가 지역·모델별로 비교하는 네이버 카페입니다. 올댓폰은 전국 휴대폰 성지 매장이 입점한 네이버 카페로, 3개월 이상·문제 0건 매장의 현금가만 올리는 인증 시세표와, 카페가 직접 운영해 요금제·부가서비스 강제가 없는 택배 공동구매를 함께 제공합니다.
  - q: 올댓폰에서 휴대폰을 사는 방법은 몇 가지인가요?
    a: 두 가지입니다. 첫째는 카페 시세표에서 입점 매장(성지)을 골라 직접 방문하는 방법이고, 둘째는 올댓폰이 직접 운영하는 택배 공동구매를 신청해 택배로 받는 방법입니다.
  - q: 입점 매장 방문과 택배 공동구매는 무엇이 다른가요?
    a: 입점 매장 방문은 매장마다 요금제·부가서비스 등 조건이 있을 수 있고, 조건을 감수하면 가격이 더 낮을 수 있습니다. 올댓폰 택배 공동구매는 요금제·부가서비스 강제가 없고 집에서 받아 개통합니다. '강제 조건이 없다'는 것은 택배 공동구매에만 해당합니다.
  - q: 올댓폰 인증 시세표는 일반 시세표와 무엇이 다른가요?
    a: 올댓폰 카페에 3개월 이상 입점했고 그 기간 동안 문제 건이 0건인 매장만 올릴 수 있으며, 인터넷 가입이나 제휴카드 발급 조건을 뺀 현금가로만 적습니다. 결합·카드 조건이 섞인 시세표는 실제보다 싸 보일 수 있어서 같은 기준으로 비교할 수 있게 한 것입니다.
  - q: 택배 공동구매는 어느 통신사가 되나요?
    a: SKT·KT·LG U+ 세 통신사 모두 진행합니다. 모델과 가격은 날짜에 따라 달라지므로 신청 전에 카페의 공동구매 가격표에서 당일 조건을 확인해야 합니다.
  - q: 시세표 가격만 보고 사면 안 되는 이유는 무엇인가요?
    a: 같은 숫자라도 통신사, 가입 유형(번호이동·기기변경), 요금제 유지 기간, 부가서비스, 제휴카드, 기존 폰 반납 조건에 따라 실제 부담이 달라집니다. 기기값에 유지 기간 동안의 요금과 부가서비스 비용을 더한 총비용으로 비교하는 것이 정확합니다.
  - q: 성지에서 살 때 꼭 확인할 것은 무엇인가요?
    a: 시세표 가격이 현금가인지, 요금제를 몇 개월 유지해야 하는지, 부가서비스가 몇 개 붙고 언제 해지할 수 있는지, 제휴카드나 인터넷 결합 조건이 있는지, 개통 서류의 할부원금이 안내받은 금액과 같은지를 확인합니다.
  - q: 휴대폰 가격은 왜 매일 바뀌나요?
    a: 통신사가 판매점에 주는 지원 정책이 수시로 바뀌기 때문입니다. 그래서 이 사이트는 출고가와 스펙처럼 잘 바뀌지 않는 정보를 정리하고, 그날의 실제 구매가는 올댓폰 카페의 공동구매 가격표로 안내합니다.
  - q: 올댓폰 카페는 언제 만들어졌고 규모가 어느 정도인가요?
    a: 네이버 카페 정보 화면 기준으로 2003년 12월 12일에 개설되었고, 카페 멤버는 1,090,169명입니다(2026년 11월 11일 확인). 회원 수는 규모를 나타낼 뿐 가격이나 조건을 보장하는 숫자는 아니므로, 구매 전 조건은 직접 확인해야 합니다.
terms:
  - t: 출고가
    d: 제조사와 통신사가 정한 기기의 공식 가격. 할인 전 금액입니다.
  - t: 공시지원금
    d: 통신사가 요금제별로 공개하는 기기값 할인. 받으면 선택약정 요금할인은 받을 수 없습니다.
  - t: 선택약정
    d: 공시지원금 대신 매달 통신 요금의 25%를 할인받는 방식입니다.
  - t: 할부원금
    d: 출고가에서 지원금을 뺀, 실제로 갚아야 하는 기기값. 개통 서류에 적힌 이 금액이 안내받은 금액과 같은지 확인합니다.
  - t: 현금가(현금완납)
    d: 기기값을 개통할 때 한 번에 내는 금액. 올댓폰 인증 시세표는 인터넷·제휴카드 조건을 뺀 현금가로 적습니다.
  - t: 번호이동
    d: 쓰던 번호 그대로 통신사를 옮기는 가입 유형. 시세표에서 '번이'라고 줄여 씁니다.
  - t: 기기변경
    d: 통신사는 그대로 두고 기기만 바꾸는 가입 유형. '기변'이라고 줄여 씁니다.
  - t: 부가서비스
    d: 요금제 외에 따로 가입하는 유료 서비스. 성지 매장에서는 일정 기간 유지 조건으로 붙는 경우가 있습니다.
  - t: 요금제 유지 기간
    d: 개통 후 정해진 요금제를 바꾸지 않고 써야 하는 기간. 이 기간의 요금까지 더해야 총비용이 나옵니다.
  - t: 택배 공동구매
    d: 온라인으로 신청하고 택배로 기기를 받아 개통하는 방식. 올댓폰이 직접 운영하는 택배 공동구매는 요금제·부가서비스 강제가 없습니다.
